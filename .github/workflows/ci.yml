name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # 하이드레이션 생존율 게이트는 실제 브라우저가 있어야 한다 — 프리렌더 본문이
      # 마운트 때 지워진 뒤에도 같은 문장이 DOM에 남는지를 보는 검사라서,
      # 정적 파일 대조로는 판정할 수 없다. 브라우저 다운로드가 Vercel 빌드에
      # 얹히지 않도록 devDependency는 playwright-core(브라우저 미포함)만 두고,
      # 크로미움은 CI에서만 받는다. 버전은 lockfile의 playwright-core와 같아야
      # 같은 리비전을 찾는다.
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium

      - name: Verify hydration survival
        run: npm run verify:hydration

      # 브랜드 폰트 문자셋도 같은 이유로 브라우저가 필요하다 — 제목·히어로 수치는
      # 마운트 후에 그려져서 dist HTML엔 없다. 서브셋 cmap에 없는 글자가 화면에
      # 남아 있으면(= 그 글자만 다른 서체로 찍히면) 여기서 빨개진다.
      - name: Verify brand font coverage
        run: npm run verify:brand-font

      # 공급망 신원 검증: vendor tgz↔README↔package.json 대조 + 커밋된 SBOM의 신원 대조.
      # 네트워크·재생성 없이 파일만 읽으므로 1초 미만이고 결정적이다.
      # (SBOM 재생성 후 diff 방식은 timestamp·documentNamespace·npm 버전 때문에 상시 실패한다)
      - name: Verify vendored artifacts
        run: npm run verify:supply-chain

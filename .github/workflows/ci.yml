name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      # 공급망 신원 검증: vendor tgz↔README↔package.json 대조 + 커밋된 SBOM의 신원 대조.
      # 네트워크·재생성 없이 파일만 읽으므로 1초 미만이고 결정적이다.
      # (SBOM 재생성 후 diff 방식은 timestamp·documentNamespace·npm 버전 때문에 상시 실패한다)
      - name: Verify vendored artifacts
        run: npm run verify:supply-chain

    <!-- hreflang 없음: 이 앱은 한국어 단일 언어라 대체 언어판이 존재하지 않는다.
         예전에는 여기에 /card/fuel-card를 하드코딩해 두어, 모든 페이지가 "내 대표

         어느 라우트로 서빙될지 모르므로 페이지별 URL을 여기 박아서는 안 된다. -->

    <!-- 테마 — teal 계열 -->
    <meta name="theme-color" content="hsl(174, 70%, 24%)" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="hsl(174, 30%, 12%)" media="(prefers-color-scheme: dark)" />

    <!-- JSON-LD를 셸에 두지 않는다: 여기 있던 WebApplication 블록은 name·url을
         "주유 할인카드 비교 계산기"/card/fuel-card로 고정해 34개 전 페이지에 실렸다.
         그 결과 /overseas-payment 같은 페이지가 자기를 주유 계산기라고 선언하고,
         /fuel-card는 같은 엔티티를 두 번 싣고 있었다.
         스키마는 라우트를 아는 쪽(scripts/prerender*.mjs와 useSEO)만 발행한다.
         validate-static-output.mjs가 엔티티 url == canonical을 강제한다. -->

    <script>
      // v3 6.10 - 사이트 전역 테마 키. 카테고리별로 나누지 않는다(이 앱은 원래
      // car-tools:theme:v1을 잘못 참조하고 있었다 - card인데 car 키였다).
      // 기존 저장값이 있으면 그대로 이전해 사용자의 선택을 유지한다.
      (() => {
        try {
          const key = "shakilabs:theme:v1";
          const legacyKey = "car-tools:theme:v1";
          let saved = localStorage.getItem(key);
          if (saved !== "dark" && saved !== "light") {
            const legacy = localStorage.getItem(legacyKey);
            if (legacy === "dark" || legacy === "light") {
              saved = legacy;
              localStorage.setItem(key, legacy);
            }
          }
          const prefersDark =
            typeof window.matchMedia === "function" &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          const theme =
            saved === "dark" || saved === "light"
              ? saved
              : prefersDark
                ? "dark"
                : "light";
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          }
          document.documentElement.style.colorScheme = theme;
        } catch {}
      })();
    </script>
    <!-- Critical CSS: card 테마 — 소비·생활 그룹 청록 -->
    <style>
      :root {
        /* Archive 톤 중성 — root와 온도를 맞춘다 (docs/ARCHIVE_TONE_SPEC.md §1). */
        /* v3 §2.1 역할 토큰 — 목표 hex에서 HSL을 역산했다(반올림하면 빗나간다:
           `60 9% 96%`는 #F6F6F4). `40 25% 99%`(=#FDFDFC 실측)는 v3가 폐기 목록에
           올린 아이보리다 — 순백 카드와 대비가 1% 남짓이라 canvas/card 계층이 안 보였다. */
        --background: 60 11.11% 96.47%; /* color.canvas #F7F7F5 */
        --foreground: 0 0% 3.92%; /* color.ink #0A0A0A */
        --muted: 36 14% 95%;
        --muted-foreground: 60 3.37% 34.9%; /* color.ink-muted #5C5C56 */
        --card: 0 0% 100%; /* color.card #FFFFFF */
        --card-foreground: 0 0% 3.92%;
        /* 소비·생활 그룹(card·nutri·baby) 공통 청록. 세 앱이 같은 리터럴을 쓰므로
           앱마다 재계산하지 않는다 — scripts/verify-accent-tokens.mjs가 문자열로 대조한다.
           --accent-foreground는 파생 공식값 30%가 아니라 28%다: 30%는 이 틴트 위
           4.37:1로 AA 미달이고 28%는 4.92:1이다(공식보다 실측이 이긴다). */
        --primary: 174 70% 24%;
        --primary-foreground: 0 0% 100%;
        --secondary: 174 15% 91%;
        --secondary-foreground: 222 47% 11%;
        --accent: 174 68% 95%;
        --accent-foreground: 174 70% 28%;
        --popover: 0 0% 100%;
        --popover-foreground: 222 47% 11%;
        /* text-destructive는 입력 검증 에러 문구에 쓰이는 본문 텍스트다. 값은 v3 §2.1
           고정 위험색(#C62828)의 HSL 역산이고, --status-danger와 같은 리터럴을 쓴다 —
           패키지가 --sh-color-danger를 --destructive에서 가져오기 때문에 둘이 갈라지면
           같은 화면에 빨강이 두 종류로 찍힌다. */
        --destructive: 0 66.4% 46.7%;
        --destructive-foreground: 210 40% 98%;
        --border: 60 8% 90.2%; /* color.line #E8E8E4 */
        --input: 60 8% 90.2%;
        --ring: 174 70% 24%;
        --radius: 0.4rem;

        /* v3 AppShell: ShGlobalHeader(검정, sticky)가 새로 생겨 --header-h는 이제
           그 높이(56px, 패키지 고정값)를 가리킨다. SecondaryNav(ShPrimaryNavigation)
           높이는 --secondary-nav-h로 분리한다 — scroll-padding-top 계산의 단일 출처.
           v3 §3.3-1로 모바일 인라인 내비가 사라져 데스크톱 1행(실측 49px)만 남는다. */
        --header-h: 56px;
        --secondary-nav-h: 49px;
        --accent-hsl: var(--primary);
        --accent-muted-hsl: 174 68% 95%;

        /* v3 §2.1 고정 의미색(#1B7A4A·#B45309·#C62828·#1D4E8C)의 HSL 역산. 12개 앱이
           같은 값을 써야 "초록=이득"이 앱을 옮겨도 같은 뜻으로 읽힌다. 자리올림 없이
           hex로 되돌아오는 소수 표기를 골랐다(게이트가 hex로 대조한다).
           v3에 없던 5번째 색(주의)은 쓰는 곳이 0이라 같이 지운다. */
        --status-success: 149.7 63.8% 29.2%;
        --status-warning: 26 90.5% 37.1%;
        --status-danger: 0 66.4% 46.7%;
        --status-info: 213.5 65.7% 33.1%;
      }

      .dark {
        /* Archive 다크 원본(#14120f/#f3efe9/#a49c93/#2e2a25) 대응 */
        --background: 40 11% 9%;
        --foreground: 36 30% 93%;
        --muted: 36 10% 16%;
        --muted-foreground: 30 11% 70%;
        --card: 36 10% 16%;
        --card-foreground: 36 30% 93%;
        --primary: 174 70% 45%;
        --primary-foreground: 174 70% 10%;
        --secondary: 174 15% 20%;
        --secondary-foreground: 210 40% 96%;
        --accent: 174 50% 22%;
        --accent-foreground: 174 70% 78%;
        --popover: 217 33% 17%;
        --popover-foreground: 210 40% 96%;
        /* 다크 빨강도 v3 고정값(#F07171)으로 맞춘다. 글자로 쓸 때와 배경으로 쓸 때가
           동시에(솔리드 배지 포함) 통과해야 해서 짝 토큰은 hue를 유지한 채 어둡게 남겨 둔다. */
        --destructive: 0 80.9% 69.2%;
        --destructive-foreground: 0 65% 12%;
        --border: 33 9% 24%;
        --input: 33 9% 28%;
        --ring: 174 70% 45%;
        --accent-hsl: var(--primary);
        --accent-muted-hsl: 174 50% 22%;

        /* v3 §2.1 고정 다크 의미색(#5DCA8E·#F0B429·#F07171·#8BB4E8)의 HSL 역산.
           앱 브랜드 초록·빨강 별칭 두 쌍은 여기서 폐기했다 — 의미가 같은 색이
           두 이름으로 갈라져 있으면 어느 쪽이 정본인지 화면에서 알 수 없다. */
        --status-success: 147 50.7% 57.8%;
        --status-warning: 41.9 86.9% 55.1%;
        --status-danger: 0 80.9% 69.2%;
        --status-info: 213.5 66.9% 72.7%;
      }

      html {
        scroll-behavior: auto;
        font-size: 16px;
        /* sticky 헤더+내비(둘 다 top:0 부근에 고정)가 페이지 내 앵커 대상을 가리던
           문제 — 두 높이 합만큼 미리 확보한다. router의 scrollBehavior top:80
           오프셋과는 별개로, 브라우저가 네이티브 프래그먼트 이동(#main-content 등)을
           처리할 때도 적용된다. */
        scroll-padding-top: calc(var(--header-h, 56px) + var(--secondary-nav-h, 0px) + 8px);
      }

      @media (max-width: 640px) {
        html { font-size: 14px; }
      }

      /* v3 §3.3-1 — <48rem에서는 인라인 2차 내비가 숨고 헤더 드로어가 대신한다.
         스티키 층이 헤더 하나뿐이므로 앵커 오프셋에서도 2차 내비 높이를 빼야 한다. */
      @media (max-width: 47.99rem) {
        :root { --secondary-nav-h: 0px; }
      }

      body {
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        margin: 0;
        color-scheme: light dark;
      }
    </style>
